name: Build Rocket Escape APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Capacitor App
        run: |
          mkdir build
          cp index.html build/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          npx cap init "Rocket Escape" "com.rocketescape.admob" --web-dir build
          npx cap add android

      - name: Inject AdMob App ID to Android Manifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          ADMOB_APP_ID="ca-app-pub-6760609892913396~4673008602"
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>" $MANIFEST_PATH
          npx cap sync android

      - name: Build Debug APK & Play Store AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketEscape-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketEscape-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
