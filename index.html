<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rocket Escape</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #020617;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(#020617, #0f172a);
    }

    /* Native Ad Banner Container Styling */
    #native-ad-box {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 360px);
        background: rgba(15, 23, 42, 0.90);
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 15;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #native-ad-box img {
        width: 38px;
        height: 38px;
        border-radius: 6px;
    }

    .ad-details {
        flex-grow: 1;
    }

    .ad-badge {
        background: #f59e0b;
        color: #000;
        font-size: 9px;
        font-weight: bold;
        padding: 1px 4px;
        border-radius: 3px;
        display: inline-block;
    }

    .ad-title {
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        margin: 2px 0;
    }

    .ad-button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: bold;
        border-radius: 6px;
    }

    #ui {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
        pointer-events: none;
    }

    .stat {
        min-width: 125px;
        padding: 10px 16px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(255,255,255,.15);
        backdrop-filter: blur(10px);
        color: white;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    .label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .value {
        display: block;
        font-size: 23px;
        font-weight: 800;
        margin-top: 2px;
    }

    #startScreen,
    #gameOver {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(2, 6, 23, .72);
        backdrop-filter: blur(5px);
    }

    .panel {
        width: min(90%, 420px);
        padding: 30px 25px;
        border-radius: 25px;
        text-align: center;
        color: white;
        background: rgba(15, 23, 42, .92);
        border: 1px solid rgba(255,255,255,.15);
        box-shadow: 0 25px 80px rgba(0,0,0,.45);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
    }

    h1 {
        font-size: 38px;
    }

    .rocketIcon {
        font-size: 55px;
    }

    .description {
        color: #94a3b8;
        line-height: 1.5;
        font-size: 14px;
    }

    button {
        border: none;
        padding: 12px 24px;
        border-radius: 14px;
        color: white;
        background: linear-gradient(135deg,#2563eb,#7c3aed);
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(37,99,235,.35);
        width: 100%;
    }

    .btn-reward {
        background: linear-gradient(135deg,#10b981,#059669);
        box-shadow: 0 10px 25px rgba(16,185,129,.35);
    }

    #gameOver {
        display: none;
    }

    #finalScore {
        font-size: 45px;
        font-weight: 900;
    }

    @media(max-width:600px) {
        #ui {
            top: 10px;
            gap: 6px;
        }

        .stat {
            min-width: 95px;
            padding: 8px 10px;
        }

        .value {
            font-size: 19px;
        }

        h1 {
            font-size: 32px;
        }
    }
</style>
</head>

<body>

<!-- AdMob Native Advanced Placement UI -->
<div id="native-ad-box">
    <span class="ad-badge">Ad</span>
    <img src="https://via.placeholder.com/40" id="ad-icon" alt="Sponsor">
    <div class="ad-details">
        <div class="ad-title" id="ad-headline">Space Explorer Pro</div>
        <button class="ad-button">Install Now</button>
    </div>
</div>

<canvas id="game"></canvas>

<div id="ui">
    <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
    </div>

    <div class="stat">
        <span class="label">Gravity</span>
        <span class="value" id="gravity">0.38</span>
    </div>
</div>

<div id="startScreen">
    <div class="panel">
        <div class="rocketIcon">🚀</div>
        <h1>Rocket Escape</h1>

        <p class="description">
            Fly your rocket through the asteroid fields.
            Avoid the asteroids and survive as long as possible!
        </p>

        <button onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="gameOver">
    <div class="panel">
        <div class="rocketIcon">💥</div>
        <h1>GAME OVER</h1>

        <div id="finalScore">0</div>

        <button class="btn-reward" onclick="watchRewardAd()">🎬 WATCH AD TO REVIVE (+1 LIFE)</button>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
/* ==========================================
   ADMOB SDK INTEGRATION
========================================== */
const ADMOB_APP_ID = 'ca-app-pub-6760609892913396~4673008602';
const REWARDED_AD_ID = 'ca-app-pub-6760609892913396/1939421098';
const NATIVE_AD_ID = 'ca-app-pub-6760609892913396/6112056661';

async function initAdMob() {
    if (window.Capacitor && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        await AdMob.initialize({ requestTrackingAuthorization: true });
        prepareRewardedAd();
    }
}

async function prepareRewardedAd() {
    if (window.Capacitor && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        await AdMob.prepareRewardVideoAd({ adId: REWARDED_AD_ID });
    }
}

async function watchRewardAd() {
    if (window.Capacitor && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        try {
            await AdMob.showRewardVideoAd();
            reviveRocket();
            prepareRewardedAd();
        } catch (e) {
            alert("Ad unavailable. Restarting game...");
            restartGame();
        }
    } else {
        alert("[TEST MODE] Rewarded Ad Completed! Rocket Revived.");
        reviveRocket();
    }
}

/* ==========================================
   GAME ENGINE CODE
========================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

let gameRunning = false;
let gameStarted = false;
let score = 0;
let gravity = 0.38;
let frame = 0;
let asteroidSpeed = 3.2;
let asteroidGap = 190;

let stars = [];
let asteroids = [];

const rocket = {
    x: 150,
    y: 300,
    width: 54,
    height: 28,
    velocity: 0,
    rotation: 0
};

function createStars() {
    stars = [];
    for(let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + .5,
            speed: Math.random() * 1.5 + .2,
            alpha: Math.random() * .8 + .2
        });
    }
}
createStars();

function drawStars() {
    for(const star of stars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.x -= star.speed;

        if(star.x < -5) {
            star.x = W + 5;
            star.y = Math.random() * H;
        }
    }
    ctx.globalAlpha = 1;
}

function drawRocket() {
    ctx.save();
    ctx.translate(rocket.x, rocket.y);
    ctx.rotate(rocket.rotation);

    const fireLength = 15 + Math.random() * 15;
    const gradient = ctx.createLinearGradient(-45, 0, -10, 0);
    gradient.addColorStop(0, "#ef4444");
    gradient.addColorStop(.5, "#f97316");
    gradient.addColorStop(1, "#fde047");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(-25 - fireLength, -7);
    ctx.lineTo(-25 - fireLength * .7, 0);
    ctx.lineTo(-25 - fireLength, 7);
    ctx.closePath();
    ctx.fill();

    const bodyGradient = ctx.createLinearGradient(-25, 0, 25, 0);
    bodyGradient.addColorStop(0, "#cbd5e1");
    bodyGradient.addColorStop(.5, "#f8fafc");
    bodyGradient.addColorStop(1, "#94a3b8");

    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.moveTo(30, 0);
    ctx.quadraticCurveTo(17, -14, -10, -13);
    ctx.lineTo(-25, -9);
    ctx.lineTo(-25, 9);
    ctx.lineTo(-10, 13);
    ctx.quadraticCurveTo(17, 14, 30, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.moveTo(30, 0);
    ctx.quadraticCurveTo(20, -10, 5, -11);
    ctx.quadraticCurveTo(20, 0, 5, 11);
    ctx.quadraticCurveTo(20, 10, 30, 0);
    ctx.fill();

    ctx.fillStyle = "#38bdf8";
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(5, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(-10, 9); ctx.lineTo(-3, 19); ctx.lineTo(5, 12);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-10, -9); ctx.lineTo(-3, -19); ctx.lineTo(5, -12);
    ctx.closePath(); ctx.fill();

    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);
    ctx.fillStyle = "#475569";
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 3;

    ctx.beginPath();
    for(let i = 0; i < a.points.length; i++) {
        const angle = (Math.PI * 2 / a.points.length) * i;
        const radius = a.points[i];
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        if(i === 0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#334155";
    for(let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc((Math.random()-.5)*a.size, (Math.random()-.5)*a.size, a.size*.12, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function createAsteroidField() {
    const gapY = 130 + Math.random() * (H - 260);
    const gap = asteroidGap;
    const topHeight = gapY - gap / 2;
    const bottomY = gapY + gap / 2;
    const size = 35 + Math.random() * 15;

    asteroids.push({
        x: W + 80,
        y: topHeight / 2,
        size: size,
        height: topHeight,
        points: randomAsteroidPoints(size),
        rotation: Math.random() * Math.PI,
        rotationSpeed: (Math.random()-.5)*.03,
        passed: false
    });

    asteroids.push({
        x: W + 80,
        y: bottomY + (H-bottomY)/2,
        size: size,
        height: H-bottomY,
        points: randomAsteroidPoints(size),
        rotation: Math.random() * Math.PI,
        rotationSpeed: (Math.random()-.5)*.03,
        passed: false
    });
}

function randomAsteroidPoints(size) {
    let points = [];
    const count = 10;
    for(let i = 0; i < count; i++) {
        points.push(size * (.75 + Math.random()*.35));
    }
    return points;
}

function collision(a,b) {
    return (
        a.x - a.width/2 < b.x + b.size &&
        a.x + a.width/2 > b.x - b.size &&
        a.y - a.height/2 < b.y + b.size &&
        a.y + a.height/2 > b.y - b.size
    );
}

function reviveRocket() {
    rocket.y = H / 2;
    rocket.velocity = 0;
    asteroids = asteroids.filter(a => a.x > rocket.x + 100);
    gameRunning = true;
    document.getElementById("gameOver").style.display = "none";
    boost();
}

function update() {
    if(!gameRunning) return;

    frame++;
    rocket.velocity += gravity;
    rocket.y += rocket.velocity;
    rocket.rotation = Math.max(-.5, Math.min(rocket.velocity * .04, .8));

    if(frame % 105 === 0) {
        createAsteroidField();
    }

    for(let i = asteroids.length-1; i >= 0; i--) {
        const a = asteroids[i];
        a.x -= asteroidSpeed;
        a.rotation += a.rotationSpeed;

        if(collision(rocket,a)) {
            endGame();
        }

        if(!a.passed && a.x < rocket.x) {
            a.passed = true;
            if(a.y < H/2) {
                score++;
                document.getElementById("score").textContent = score;

                if(score % 5 === 0) {
                    asteroidSpeed += .2;
                    if(asteroidGap > 130) asteroidGap -= 5;
                }
            }
        }

        if(a.x < -100) {
            asteroids.splice(i,1);
        }
    }

    if(rocket.y - rocket.height/2 < 0 || rocket.y + rocket.height/2 > H) {
        endGame();
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0, "#020617");
    bg.addColorStop(1, "#111827");
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    drawStars();

    for(const a of asteroids) {
        drawAsteroid(a);
    }

    drawRocket();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

function boost() {
    if(!gameRunning) return;
    rocket.velocity = -7.2;
}

document.addEventListener("keydown", e => {
    if(e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        boost();
    }
});

canvas.addEventListener("mousedown", boost);
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    boost();
}, {passive:false});

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    gameStarted = true;
    gameRunning = true;
    resetGame();
    boost();
}

function resetGame() {
    score = 0;
    frame = 0;
    asteroidSpeed = 3.2;
    asteroidGap = 190;
    gravity = .38;
    rocket.x = 150;
    rocket.y = H/2;
    rocket.velocity = 0;
    rocket.rotation = 0;
    asteroids = [];

    document.getElementById("score").textContent = "0";
    document.getElementById("gravity").textContent = gravity.toFixed(2);
}

function endGame() {
    if(!gameRunning) return;
    gameRunning = false;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}

function restartGame() {
    document.getElementById("gameOver").style.display = "none";
    resetGame();
    gameRunning = true;
    boost();
}

window.onload = () => {
    initAdMob();
};
</script>
</body>
</html>
